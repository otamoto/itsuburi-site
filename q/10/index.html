<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>いつぶり？ — 最後に卵かけご飯を食べたのは？</title>
<style>
  :root {
    --paper: #FBF6EC;
    --ink: #2B2A2E;
    --ink2: #4A4842;
    --ink3: #6E6B66;
    --line: #D9D3C8;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    line-height: 1.9;
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 20px 80px;
    text-align: center;
  }
  h1 {
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: var(--ink3);
    margin: 0 0 2.4em;
    font-weight: 400;
  }
  .question {
    font-size: 1.4rem;
    line-height: 1.8;
    margin: 0 0 2.8em;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }
  .btn {
    display: inline-block;
    width: 100%;
    max-width: 320px;
    box-sizing: border-box;
    padding: 14px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .note { font-size: 0.85rem; color: var(--ink3); margin-top: 3em; }
  .note a { color: var(--ink2); }
</style>
</head>
<body>
<h1>いつぶり？</h1>
<p class="question">最後に卵かけご飯を食べたのは？</p>
<div class="actions">
  <a class="btn primary" href="itsuburi://q/10">アプリで開く</a>
  <a class="btn secondary" href="https://apps.apple.com/jp/app/id6814577326">App Storeで入手</a>
  <!-- Google Playは未公開のため非表示。公開後はここに
       <a class="btn secondary" href="https://play.google.com/store/apps/details?id=...">Google Playで入手</a>
       を追加する -->
</div>
<p class="note"><a href="../../">アプリについて</a></p>
</body>
</html>
